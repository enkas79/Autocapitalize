<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box}body{margin:0;width:1280px;height:800px;font-family:Inter,"DejaVu Sans",sans-serif;background:linear-gradient(135deg,#2563eb,#7c3aed);display:flex;align-items:center;justify-content:center;gap:64px;padding:0 72px;color:#fff}
.copy{flex:0 0 400px}.copy img{width:96px;height:96px;margin-bottom:28px}
h1{font-size:50px;line-height:1.1;margin:0 0 20px}p{font-size:22px;line-height:1.5;margin:0;opacity:.92}
.win{flex:1;background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);color:#1f2937;overflow:hidden}
.bar{background:#f3f4f6;padding:14px 20px;font-size:17px;font-weight:600;border-bottom:1px solid #e5e7eb}
.row{padding:12px 24px;border-bottom:1px solid #eef0f3;font-size:18px;color:#6b7280}.row b{color:#111;font-weight:500}
textarea{width:100%;height:330px;border:0;outline:0;resize:none;padding:24px;font:22px/1.6 Inter,"DejaVu Sans",sans-serif;color:#111}
.foot{padding:14px 24px;border-top:1px solid #eef0f3}.btn{display:inline-block;background:#2563eb;color:#fff;border-radius:8px;padding:10px 26px;font-size:18px;font-weight:600}
</style>
<div class="copy"><img src="../icons/icon128.png"><h1>Capital letters, automatically.</h1><p>Starts every sentence with a capital after . ? ! and new lines, on any website.</p></div>
<div class="win"><div class="bar">New message</div>
<div class="row">To: <b>team@example.com</b></div><div class="row">Subject: <b>Release notes</b></div>
<textarea id="t" autofocus></textarea><div class="foot"><span class="btn">Send</span></div></div>
